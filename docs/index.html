<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offene Spiele – HR West Niedersachsen</title>
<meta name="theme-color" content="#c0392b" />
<meta name="description" content="Offene Schiedsrichter-Ansetzungen im Regionsspielplan HR West Niedersachsen" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Offene Spiele" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --panel-bg: #ffffff;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --accent: #c0392b;
    --border: #e4e4e0;
    --input-bg: #ffffff;
    --chip-bg: #f1f1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15151a;
      --card-bg: #1f1f26;
      --panel-bg: #1f1f26;
      --text: #f0f0f0;
      --muted: #9a9aa2;
      --accent: #ff6b5b;
      --border: #2c2c34;
      --input-bg: #26262e;
      --chip-bg: #2a2a33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }
  .meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 14px;
  }
  .panel {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    display: grid;
    gap: 10px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 600;
  }
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .row > .field {
    flex: 1 1 160px;
    min-width: 140px;
  }
  input, select {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 0.9rem;
    width: 100%;
  }
  input[type="range"] {
    padding: 0;
  }
  .radius-value {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .radius-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-text {
    font-size: 0.78rem;
    min-height: 1.1em;
  }
  .status-text.ok { color: #2e8b57; }
  .status-text.error { color: var(--accent); }
  .panel-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 0;
    width: auto;
  }
  .day-group {
    margin-bottom: 18px;
  }
  .day-heading {
    font-weight: 600;
    font-size: 0.9rem;
    margin: 0 0 8px;
    color: var(--accent);
    position: sticky;
    top: 0;
  }
  .game {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }
  .game.clickable { cursor: pointer; }
  .game.clickable:active { background: var(--chip-bg); }
  .game.expanded {
    border-radius: 10px 10px 0 0;
    margin-bottom: 0;
  }
  .hall-hint {
    display: block;
    margin-top: 4px;
    color: var(--accent);
    font-weight: 600;
  }
  .hall-expand {
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    margin-bottom: 8px;
    padding: 8px 14px;
  }
  .hall-expand-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .hall-expand-item {
    font-size: 0.82rem;
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }
  .hall-expand-item:first-of-type { border-top: none; }
  .hall-expand-item .hei-when { font-weight: 600; }
  .hall-expand-item .hei-league { color: var(--muted); font-size: 0.75rem; }
  .game-main { min-width: 0; }
  .game-time {
    font-weight: 600;
    font-size: 0.92rem;
  }
  .game-league {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 2px;
  }
  .staffel-link {
    color: inherit;
    text-decoration: underline;
    text-decoration-style: dotted;
  }
  .game-teams {
    margin-top: 5px;
    font-size: 0.92rem;
  }
  .game-hall {
    margin-top: 5px;
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .game-distance {
    flex: 0 0 auto;
    text-align: right;
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .game-distance .km {
    display: block;
    font-weight: 600;
    font-size: 1rem;
    color: var(--text);
  }
  .chip {
    display: inline-block;
    background: var(--chip-bg);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 0.72rem;
    color: var(--muted);
    margin-left: 6px;
  }
  .empty, .error {
    color: var(--muted);
    padding: 24px 0;
    text-align: center;
  }
  #customRange {
    display: none;
  }
  #customRange.visible {
    display: flex;
  }
  .more-filters {
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .more-filters summary {
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    list-style: none;
  }
  .more-filters summary::-webkit-details-marker {
    display: none;
  }
  .more-filters summary::before {
    content: '▸ ';
  }
  .more-filters[open] summary::before {
    content: '▾ ';
  }
  .more-filters .row {
    margin-top: 10px;
  }
  .chip-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip-toggle {
    background: var(--chip-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    width: auto;
  }
  .chip-toggle.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .chip-removable {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 6px 4px 12px;
    font-size: 0.8rem;
  }
  .chip-removable button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0 4px;
    width: auto;
  }
  .add-row {
    display: flex;
    gap: 6px;
  }
  .add-row input { flex: 1; }
  .add-row button {
    flex: 0 0 auto;
    width: auto;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .route-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.76rem;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .view-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .view-btn {
    flex: 1;
    width: auto;
    background: var(--chip-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .view-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #map {
    height: 70vh;
    min-height: 320px;
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .leaflet-popup-content { font-size: 0.85rem; }
  .install-banner {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 0.82rem;
    display: none;
  }
  .install-banner.visible { display: block; }
  .install-banner .install-close {
    float: right;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    width: auto;
    font-size: 1rem;
  }
  .install-banner ol {
    margin: 8px 0 0;
    padding-left: 18px;
  }
  .install-banner button.install-action {
    margin-top: 8px;
    width: auto;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>Offene Spiele – HR West Niedersachsen</h1>
  <div class="meta" id="meta">Lade Daten…</div>

  <div class="install-banner" id="installBanner">
    <button class="install-close" id="installCloseBtn" type="button" title="Schließen">×</button>
    <div id="installBannerContent"></div>
  </div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label for="ort">Mein Standort</label>
        <input id="ort" type="text" placeholder="z.B. Musterstraße 1, 12345 Musterstadt" autocomplete="off" />
      </div>
      <div class="field" style="flex: 0 0 200px;">
        <label for="radius">Radius <span class="radius-value" id="radiusValue"></span></label>
        <div class="radius-row">
          <input id="radius" type="range" min="5" max="150" step="5" value="30" />
        </div>
      </div>
    </div>
    <div class="status-text" id="ortStatus"></div>

    <div class="row">
      <div class="field">
        <label for="zeitraum">Zeitraum</label>
        <select id="zeitraum">
          <option value="alle">Alle</option>
          <option value="woche">Diese Woche</option>
          <option value="wochenende">Nächstes Wochenende</option>
          <option value="4wochen">Nächste 4 Wochen</option>
          <option value="custom">Eigener Zeitraum…</option>
        </select>
      </div>
      <div class="field">
        <label for="sortierung">Sortierung</label>
        <select id="sortierung">
          <option value="datum">Datum</option>
          <option value="entfernung">Entfernung</option>
        </select>
      </div>
    </div>
    <div class="row" id="customRange">
      <div class="field">
        <label for="von">Von</label>
        <input id="von" type="date" />
      </div>
      <div class="field">
        <label for="bis">Bis</label>
        <input id="bis" type="date" />
      </div>
    </div>

    <details class="more-filters" id="moreFilters">
      <summary>Weitere Filter</summary>
      <div class="row">
        <div class="field">
          <label for="zeitVon">Uhrzeit von</label>
          <input id="zeitVon" type="time" />
        </div>
        <div class="field">
          <label for="zeitBis">Uhrzeit bis</label>
          <input id="zeitBis" type="time" />
        </div>
        <div class="field">
          <label for="altersgruppe">Altersgruppe</label>
          <select id="altersgruppe">
            <option value="alle">Alle</option>
            <option value="jugend">Nur Jugend (A/B/C)</option>
            <option value="senioren">Nur Senioren/Erwachsene</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Liga</label>
          <div class="chip-group" id="ligaChips"></div>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="vereinInput">Vereine ausblenden</label>
          <div class="add-row">
            <input id="vereinInput" type="text" placeholder="Vereinsname eingeben…" autocomplete="off" />
            <button type="button" id="vereinAddBtn">+ Hinzufügen</button>
          </div>
          <div class="chip-group" id="vereinChips"></div>
        </div>
      </div>
    </details>

    <div class="panel-footer">
      <span id="filterSummary"></span>
      <button class="link-btn" id="resetBtn" type="button">Filter zurücksetzen</button>
    </div>
  </div>

  <div class="view-toggle">
    <button type="button" class="view-btn active" id="viewListBtn">📋 Liste</button>
    <button type="button" class="view-btn" id="viewMapBtn">🗺️ Karte</button>
  </div>

  <div id="mapView" style="display:none;">
    <div id="map"></div>
  </div>

  <div id="content"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const STORAGE_KEYS = {
      home: 'srp_home_v1',
      radius: 'srp_radius_v1',
      zeitraum: 'srp_zeitraum_v1',
      sortierung: 'srp_sortierung_v1',
      von: 'srp_von_v1',
      bis: 'srp_bis_v1',
      zeitVon: 'srp_zeitvon_v1',
      zeitBis: 'srp_zeitbis_v1',
      altersgruppe: 'srp_altersgruppe_v1',
      excludedLigas: 'srp_excludedligas_v1',
      excludedClubs: 'srp_excludedclubs_v1',
      view: 'srp_view_v1',
      installDismissed: 'srp_install_dismissed_v1',
    };

    const LIGA_LABELS = { LL: 'Landesliga', ReK: 'Regionsklasse', ReL: 'Regionsliga', ROL: 'Regionsoberliga' };
    const LIGA_CODES = Object.keys(LIGA_LABELS);

    function canonicalLiga(liga) {
      return liga === 'Regionsoberliga' ? 'ROL' : liga;
    }

    function isJugend(altersklasse) {
      return /^[MW]J[ABC]$/.test(altersklasse || '');
    }

    function timeToMinutes(hhmm) {
      const m = String(hhmm || '').match(/^(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      return Number(m[1]) * 60 + Number(m[2]);
    }

    function mapsLink(hall) {
      if (hall && hall.lat != null && hall.lon != null) {
        return `https://www.google.com/maps/dir/?api=1&destination=${hall.lat},${hall.lon}`;
      }
      if (hall && hall.address) {
        return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(hall.address)}`;
      }
      return null;
    }

    function safeGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }
    function safeSet(key, value) {
      try { localStorage.setItem(key, value); } catch { /* z.B. privater Modus - einfach ignorieren */ }
    }
    function safeRemove(key) {
      try { localStorage.removeItem(key); } catch { /* ignorieren */ }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function parseGermanDate(datum) {
      const m = String(datum).match(/(\d{2})\.(\d{2})\.(\d{4})/);
      if (!m) return null;
      const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function startOfDay(d) {
      const c = new Date(d);
      c.setHours(0, 0, 0, 0);
      return c;
    }

    function formatWhen(g) {
      const dayDate = [g.tag, g.datum].filter(Boolean).join(' ');
      return [dayDate, g.zeit].filter(Boolean).join(' · ');
    }

    function staffelHtml(g) {
      const label = escapeHtml(g.staffel || '');
      if (!label) return '';
      return g.staffelUrl
        ? `<a href="${escapeHtml(g.staffelUrl)}" target="_blank" rel="noopener" class="staffel-link">${label}</a>`
        : label;
    }

    function compareByDateTime(a, b) {
      const da = parseGermanDate(a.datum);
      const db = parseGermanDate(b.datum);
      if (da && db && da.getTime() !== db.getTime()) return da - db;
      return (a.zeit || '').localeCompare(b.zeit || '');
    }

    function dateRangeFor(zeitraum, von, bis) {
      const today = startOfDay(new Date());
      if (zeitraum === 'woche') {
        const dow = today.getDay();
        const diffToMonday = dow === 0 ? -6 : 1 - dow;
        const monday = new Date(today);
        monday.setDate(today.getDate() + diffToMonday);
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        return { from: monday, to: sunday };
      }
      if (zeitraum === 'wochenende') {
        const dow = today.getDay(); // 0=So..6=Sa
        const diffToSaturday = dow === 6 ? 0 : dow === 0 ? -1 : 6 - dow;
        const saturday = new Date(today);
        saturday.setDate(today.getDate() + diffToSaturday);
        const sunday = new Date(saturday);
        sunday.setDate(saturday.getDate() + 1);
        return { from: saturday, to: sunday };
      }
      if (zeitraum === '4wochen') {
        const to = new Date(today);
        to.setDate(today.getDate() + 28);
        return { from: today, to };
      }
      if (zeitraum === 'custom') {
        const from = von ? startOfDay(new Date(von)) : null;
        const to = bis ? startOfDay(new Date(bis)) : null;
        return { from, to };
      }
      return { from: null, to: null }; // "alle"
    }

    async function geocode(query) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=${encodeURIComponent(query)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Geocoding fehlgeschlagen (HTTP ' + res.status + ')');
      const data = await res.json();
      if (!data.length) throw new Error('Adresse nicht gefunden');
      return { lat: Number(data[0].lat), lon: Number(data[0].lon) };
    }

    const els = {
      meta: document.getElementById('meta'),
      content: document.getElementById('content'),
      ort: document.getElementById('ort'),
      ortStatus: document.getElementById('ortStatus'),
      radius: document.getElementById('radius'),
      radiusValue: document.getElementById('radiusValue'),
      zeitraum: document.getElementById('zeitraum'),
      sortierung: document.getElementById('sortierung'),
      customRange: document.getElementById('customRange'),
      von: document.getElementById('von'),
      bis: document.getElementById('bis'),
      zeitVon: document.getElementById('zeitVon'),
      zeitBis: document.getElementById('zeitBis'),
      altersgruppe: document.getElementById('altersgruppe'),
      ligaChips: document.getElementById('ligaChips'),
      vereinInput: document.getElementById('vereinInput'),
      vereinAddBtn: document.getElementById('vereinAddBtn'),
      vereinChips: document.getElementById('vereinChips'),
      filterSummary: document.getElementById('filterSummary'),
      resetBtn: document.getElementById('resetBtn'),
      viewListBtn: document.getElementById('viewListBtn'),
      viewMapBtn: document.getElementById('viewMapBtn'),
      mapView: document.getElementById('mapView'),
      installBanner: document.getElementById('installBanner'),
      installBannerContent: document.getElementById('installBannerContent'),
      installCloseBtn: document.getElementById('installCloseBtn'),
    };

    let data = null;
    let home = null; // { query, lat, lon }
    let excludedLigas = new Set();
    let excludedClubs = [];
    let currentView = 'liste';
    let leafletMap = null;
    let markersLayer = null;
    let deferredInstallPrompt = null;
    let hallIndex = new Map(); // ort -> alle offenen Spiele in dieser Halle (ungefiltert)

    function renderLigaChips() {
      els.ligaChips.innerHTML = LIGA_CODES.map((code) => {
        const active = !excludedLigas.has(code) ? 'active' : '';
        return `<button type="button" class="chip-toggle ${active}" data-liga="${code}">${escapeHtml(LIGA_LABELS[code])}</button>`;
      }).join('');
      for (const btn of els.ligaChips.querySelectorAll('.chip-toggle')) {
        btn.addEventListener('click', () => {
          const code = btn.dataset.liga;
          if (excludedLigas.has(code)) excludedLigas.delete(code);
          else excludedLigas.add(code);
          safeSet(STORAGE_KEYS.excludedLigas, [...excludedLigas].join(','));
          renderLigaChips();
          render();
        });
      }
    }

    function renderVereinChips() {
      els.vereinChips.innerHTML = excludedClubs
        .map(
          (name, i) =>
            `<span class="chip-removable">${escapeHtml(name)}<button type="button" data-idx="${i}" title="Entfernen">×</button></span>`
        )
        .join('');
      for (const btn of els.vereinChips.querySelectorAll('button')) {
        btn.addEventListener('click', () => {
          excludedClubs.splice(Number(btn.dataset.idx), 1);
          safeSet(STORAGE_KEYS.excludedClubs, JSON.stringify(excludedClubs));
          renderVereinChips();
          render();
        });
      }
    }

    function addExcludedClub() {
      const name = els.vereinInput.value.trim();
      if (!name || excludedClubs.some((c) => c.toLowerCase() === name.toLowerCase())) {
        els.vereinInput.value = '';
        return;
      }
      excludedClubs.push(name);
      safeSet(STORAGE_KEYS.excludedClubs, JSON.stringify(excludedClubs));
      els.vereinInput.value = '';
      renderVereinChips();
      render();
    }

    function ensureMap() {
      if (leafletMap) return leafletMap;
      leafletMap = L.map('map').setView([52.9, 8.0], 8); // grobe Mitte des HVNB-Gebiets
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende',
      }).addTo(leafletMap);
      markersLayer = L.layerGroup().addTo(leafletMap);
      return leafletMap;
    }

    function updateMapMarkers(games) {
      const map = ensureMap();
      markersLayer.clearLayers();

      const byHall = new Map();
      for (const g of games) {
        if (!g.hall || g.hall.lat == null || g.hall.lon == null) continue;
        if (!byHall.has(g.ort)) byHall.set(g.ort, { hall: g.hall, games: [] });
        byHall.get(g.ort).games.push(g);
      }

      const bounds = [];
      for (const { hall, games: hallGames } of byHall.values()) {
        const link = mapsLink(hall);
        const shown = hallGames.slice(0, 8);
        const gamesHtml = shown
          .map(
            (g) =>
              `<div style="margin-bottom:4px;"><b>${escapeHtml(g.tag)} ${escapeHtml(g.datum)} ${escapeHtml(g.zeit)}</b><br>` +
              `${escapeHtml(g.liga)} ${escapeHtml(g.altersklasse)} · ${staffelHtml(g)}<br>${escapeHtml(g.heim)} – ${escapeHtml(g.gast)}</div>`
          )
          .join('');
        const more = hallGames.length > shown.length ? `<div>… und ${hallGames.length - shown.length} weitere</div>` : '';
        const popup =
          `<b>${escapeHtml(hall.name || '')}</b><br>${escapeHtml(hall.address || '')}` +
          (link ? ` · <a href="${link}" target="_blank" rel="noopener">Route</a>` : '') +
          `<hr>${gamesHtml}${more}`;
        L.marker([hall.lat, hall.lon]).bindPopup(popup).addTo(markersLayer);
        bounds.push([hall.lat, hall.lon]);
      }

      if (home) {
        L.circleMarker([home.lat, home.lon], {
          radius: 8,
          color: '#2e8b57',
          fillColor: '#2e8b57',
          fillOpacity: 0.9,
        })
          .bindPopup('Mein Standort')
          .addTo(markersLayer);
        bounds.push([home.lat, home.lon]);
      }

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
      }
      setTimeout(() => map.invalidateSize(), 50);
    }

    function toggleHallExpand(card) {
      const existing = card.nextElementSibling;
      if (existing && existing.classList.contains('hall-expand')) {
        existing.remove();
        card.classList.remove('expanded');
        return;
      }
      document.querySelectorAll('.hall-expand').forEach((el) => el.remove());
      document.querySelectorAll('.game.expanded').forEach((el) => el.classList.remove('expanded'));

      const ort = card.dataset.ort;
      const idx = Number(card.dataset.idx);
      const others = (hallIndex.get(ort) || [])
        .filter((g) => g._idx !== idx)
        .sort(compareByDateTime);
      if (!others.length) return;

      const itemsHtml = others
        .map(
          (g) => `
            <div class="hall-expand-item">
              <div class="hei-when">${escapeHtml(formatWhen(g))}</div>
              <div class="hei-league">${escapeHtml(g.liga)} ${escapeHtml(g.altersklasse)} · ${staffelHtml(g)}</div>
              <div>${escapeHtml(g.heim)} – ${escapeHtml(g.gast)}</div>
            </div>`
        )
        .join('');

      const div = document.createElement('div');
      div.className = 'hall-expand';
      div.innerHTML = `<div class="hall-expand-title">Weitere offene Spiele in dieser Halle</div>${itemsHtml}`;
      card.insertAdjacentElement('afterend', div);
      card.classList.add('expanded');
    }

    function setView(view) {
      currentView = view;
      safeSet(STORAGE_KEYS.view, view);
      els.viewListBtn.classList.toggle('active', view === 'liste');
      els.viewMapBtn.classList.toggle('active', view === 'karte');
      els.content.style.display = view === 'liste' ? '' : 'none';
      els.mapView.style.display = view === 'karte' ? '' : 'none';
      render();
    }

    function iosStandalone() {
      return window.navigator.standalone === true;
    }

    function isStandaloneDisplay() {
      return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
    }

    function renderInstallBanner() {
      if (safeGet(STORAGE_KEYS.installDismissed) === '1') return;
      if (iosStandalone() || isStandaloneDisplay()) return; // schon installiert

      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      let html = '';
      if (isIos) {
        html =
          '<strong>📱 Als App installieren (iOS)</strong>' +
          '<ol>' +
          '<li>Diese Seite in <b>Safari</b> öffnen (nicht Chrome/Firefox)</li>' +
          '<li>Auf das <b>Teilen</b>-Symbol tippen (Quadrat mit Pfeil nach oben)</li>' +
          '<li>Nach unten scrollen und <b>„Zum Home-Bildschirm"</b> auswählen</li>' +
          '<li>Namen bestätigen und oben rechts auf <b>„Hinzufügen"</b> tippen</li>' +
          '</ol>';
      } else if (deferredInstallPrompt) {
        html =
          '<strong>📱 Als App installieren</strong>' +
          '<div>Direkt installieren, dann öffnet sich die Seite wie eine eigene App.</div>' +
          '<button class="install-action" id="installActionBtn" type="button">Jetzt installieren</button>';
      } else {
        return; // Android/Desktop ohne Install-Prompt (z.B. schon abgelehnt) - kein Banner nötig
      }

      els.installBannerContent.innerHTML = html;
      els.installBanner.classList.add('visible');
      const actionBtn = document.getElementById('installActionBtn');
      if (actionBtn) {
        actionBtn.addEventListener('click', async () => {
          if (!deferredInstallPrompt) return;
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          els.installBanner.classList.remove('visible');
        });
      }
    }

    function loadSavedFilters() {
      const savedHome = safeGet(STORAGE_KEYS.home);
      if (savedHome) {
        try {
          home = JSON.parse(savedHome);
          els.ort.value = home.query || '';
          if (home.lat != null) {
            els.ortStatus.textContent = `Gefunden: ${home.lat.toFixed(4)}, ${home.lon.toFixed(4)}`;
            els.ortStatus.className = 'status-text ok';
          }
        } catch { home = null; }
      }
      els.radius.value = safeGet(STORAGE_KEYS.radius) || '30';
      els.zeitraum.value = safeGet(STORAGE_KEYS.zeitraum) || 'alle';
      els.sortierung.value = safeGet(STORAGE_KEYS.sortierung) || 'datum';
      els.von.value = safeGet(STORAGE_KEYS.von) || '';
      els.bis.value = safeGet(STORAGE_KEYS.bis) || '';
      els.zeitVon.value = safeGet(STORAGE_KEYS.zeitVon) || '';
      els.zeitBis.value = safeGet(STORAGE_KEYS.zeitBis) || '';
      els.altersgruppe.value = safeGet(STORAGE_KEYS.altersgruppe) || 'alle';
      const savedExcluded = safeGet(STORAGE_KEYS.excludedLigas) || '';
      excludedLigas = new Set(savedExcluded ? savedExcluded.split(',').filter(Boolean) : []);
      try {
        excludedClubs = JSON.parse(safeGet(STORAGE_KEYS.excludedClubs) || '[]');
      } catch { excludedClubs = []; }
      els.customRange.classList.toggle('visible', els.zeitraum.value === 'custom');
      els.radiusValue.textContent = `${els.radius.value} km`;
      renderLigaChips();
      renderVereinChips();
      setView(safeGet(STORAGE_KEYS.view) || 'liste');
    }

    async function resolveHome() {
      const query = els.ort.value.trim();
      if (!query) {
        home = null;
        safeRemove(STORAGE_KEYS.home);
        els.ortStatus.textContent = '';
        render();
        return;
      }
      if (home && home.query === query && home.lat != null) {
        render();
        return; // schon aufgelöst, kein erneuter Request nötig
      }
      els.ortStatus.textContent = 'Suche Adresse…';
      els.ortStatus.className = 'status-text';
      try {
        const coords = await geocode(query);
        home = { query, ...coords };
        safeSet(STORAGE_KEYS.home, JSON.stringify(home));
        els.ortStatus.textContent = `Gefunden: ${coords.lat.toFixed(4)}, ${coords.lon.toFixed(4)}`;
        els.ortStatus.className = 'status-text ok';
      } catch (err) {
        home = null;
        safeRemove(STORAGE_KEYS.home);
        els.ortStatus.textContent = err.message;
        els.ortStatus.className = 'status-text error';
      }
      render();
    }

    function currentFilters() {
      return {
        zeitraum: els.zeitraum.value,
        sortierung: els.sortierung.value,
        von: els.von.value,
        bis: els.bis.value,
        radiusKm: Number(els.radius.value),
        zeitVon: els.zeitVon.value,
        zeitBis: els.zeitBis.value,
        altersgruppe: els.altersgruppe.value,
      };
    }

    function render() {
      if (!data) return;
      const { zeitraum, sortierung, von, bis, radiusKm, zeitVon, zeitBis, altersgruppe } = currentFilters();
      const { from, to } = dateRangeFor(zeitraum, von, bis);
      const vonMin = timeToMinutes(zeitVon);
      const bisMin = timeToMinutes(zeitBis);

      let games = data.openGames.map((g) => {
        const hall = data.hallen[g.ort] || null;
        let distanceKm = null;
        if (home && hall && hall.lat != null && hall.lon != null) {
          distanceKm = haversineKm(home.lat, home.lon, hall.lat, hall.lon);
        }
        return { ...g, hall, distanceKm };
      });

      // Für die "weitere Spiele in dieser Halle"-Ausklappung: ungefiltert
      // über ALLE offenen Spiele indizieren (nicht nur die aktuell
      // sichtbaren), damit auch Spiele auffindbar sind, die z.B. durch den
      // Uhrzeit- oder Liga-Filter gerade ausgeblendet sind.
      hallIndex = new Map();
      for (const g of games) {
        if (!g.ort) continue;
        if (!hallIndex.has(g.ort)) hallIndex.set(g.ort, []);
        hallIndex.get(g.ort).push(g);
      }

      if (from || to) {
        games = games.filter((g) => {
          const d = parseGermanDate(g.datum);
          if (!d) return true; // unbekanntes Datum lieber zeigen als verstecken
          if (from && d < from) return false;
          if (to && d > to) return false;
          return true;
        });
      }

      let filteredOutByZeit = 0;
      if (vonMin != null || bisMin != null) {
        const total = games.length;
        games = games.filter((g) => {
          const mins = timeToMinutes(g.zeit);
          if (mins == null) return true; // unbekannte Uhrzeit lieber zeigen als verstecken
          if (vonMin != null && mins < vonMin) return false;
          if (bisMin != null && mins > bisMin) return false;
          return true;
        });
        filteredOutByZeit = total - games.length;
      }

      let filteredOutByAltersgruppe = 0;
      if (altersgruppe !== 'alle') {
        const total = games.length;
        games = games.filter((g) => (altersgruppe === 'jugend' ? isJugend(g.altersklasse) : !isJugend(g.altersklasse)));
        filteredOutByAltersgruppe = total - games.length;
      }

      let filteredOutByLiga = 0;
      if (excludedLigas.size > 0) {
        const total = games.length;
        games = games.filter((g) => !excludedLigas.has(canonicalLiga(g.liga)));
        filteredOutByLiga = total - games.length;
      }

      let filteredOutByVerein = 0;
      if (excludedClubs.length > 0) {
        const total = games.length;
        const needles = excludedClubs.map((c) => c.toLowerCase());
        games = games.filter((g) => {
          const heim = (g.heim || '').toLowerCase();
          const gast = (g.gast || '').toLowerCase();
          return !needles.some((n) => heim.includes(n) || gast.includes(n));
        });
        filteredOutByVerein = total - games.length;
      }

      let filteredOutByRadius = 0;
      if (home) {
        const total = games.length;
        games = games.filter((g) => g.distanceKm == null || g.distanceKm <= radiusKm);
        filteredOutByRadius = total - games.length;
      }

      games.sort((a, b) => {
        if (sortierung === 'entfernung') {
          if (a.distanceKm == null && b.distanceKm == null) return 0;
          if (a.distanceKm == null) return 1;
          if (b.distanceKm == null) return -1;
          if (a.distanceKm !== b.distanceKm) return a.distanceKm - b.distanceKm;
        }
        return compareByDateTime(a, b);
      });

      const summaryParts = [];
      if (filteredOutByZeit > 0) summaryParts.push(`${filteredOutByZeit} außerhalb der Uhrzeit ausgeblendet`);
      if (filteredOutByAltersgruppe > 0) summaryParts.push(`${filteredOutByAltersgruppe} nach Altersgruppe ausgeblendet`);
      if (filteredOutByLiga > 0) summaryParts.push(`${filteredOutByLiga} nach Liga ausgeblendet`);
      if (filteredOutByVerein > 0) summaryParts.push(`${filteredOutByVerein} durch Vereins-Ausschluss ausgeblendet`);
      if (filteredOutByRadius > 0) summaryParts.push(`${filteredOutByRadius} außerhalb des Radius ausgeblendet`);
      els.filterSummary.textContent = summaryParts.join(' · ');

      els.meta.textContent =
        `Stand: ${new Date(data.generatedAt).toLocaleString('de-DE')} · ${games.length} von ${data.openGames.length} offenen Spielen angezeigt · ` +
        `${data.weeksScanned} Wochen gescannt (${data.totalGamesSeen} Spiele insgesamt gesehen)`;

      if (currentView === 'karte') {
        updateMapMarkers(games);
        return;
      }

      if (!games.length) {
        els.content.innerHTML = '<div class="empty">Keine Spiele für die aktuelle Filterauswahl gefunden.</div>';
        return;
      }

      const groups = new Map();
      for (const g of games) {
        const key = `${g.tag} ${g.datum}`.trim();
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(g);
      }

      let html = '';
      for (const [day, dayGames] of groups) {
        html += `<div class="day-group"><div class="day-heading">${escapeHtml(day)}</div>`;
        for (const g of dayGames) {
          const link = mapsLink(g.hall);
          const hallLabel = g.hall
            ? `${escapeHtml(g.hall.name || '')}${g.hall.address ? ' · ' + escapeHtml(g.hall.address) : ''}`
            : (g.ort ? `Halle ${escapeHtml(g.ort)}` : '');
          const routeHtml = link ? `<a class="route-btn" href="${link}" target="_blank" rel="noopener">🧭 Route</a>` : '';
          const distanceHtml =
            g.distanceKm != null
              ? `<div class="game-distance"><span class="km">${g.distanceKm.toFixed(0)} km</span>Luftlinie</div>`
              : home
              ? `<div class="game-distance">Entfernung<br>unbekannt</div>`
              : '';
          const otherCount = g.ort ? (hallIndex.get(g.ort) || []).filter((o) => o._idx !== g._idx).length : 0;
          const hintHtml =
            otherCount > 0
              ? `<span class="hall-hint">▸ +${otherCount} weitere${otherCount === 1 ? 's' : ''} Spiel${otherCount === 1 ? '' : 'e'} in dieser Halle</span>`
              : '';
          html += `
            <div class="game${otherCount > 0 ? ' clickable' : ''}" data-ort="${escapeHtml(g.ort || '')}" data-idx="${g._idx}">
              <div class="game-main">
                <div class="game-time">${escapeHtml(formatWhen(g))}</div>
                <div class="game-league">${escapeHtml(g.liga)} ${escapeHtml(g.altersklasse)} · ${staffelHtml(g)}</div>
                <div class="game-teams">${escapeHtml(g.heim)} – ${escapeHtml(g.gast)}</div>
                ${hallLabel ? `<div class="game-hall"><span>${hallLabel}</span>${routeHtml}</div>` : ''}
                ${hintHtml}
              </div>
              ${distanceHtml}
            </div>`;
        }
        html += '</div>';
      }
      els.content.innerHTML = html;
    }

    function bindEvents() {
      els.content.addEventListener('click', (e) => {
        if (e.target.closest('a, button')) return; // Route-Button etc. nicht abfangen
        const card = e.target.closest('.game.clickable');
        if (!card) return;
        toggleHallExpand(card);
      });

      let ortTimer = null;
      els.ort.addEventListener('input', () => {
        clearTimeout(ortTimer);
        ortTimer = setTimeout(resolveHome, 800);
      });
      els.ort.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { clearTimeout(ortTimer); resolveHome(); }
      });

      els.radius.addEventListener('input', () => {
        els.radiusValue.textContent = `${els.radius.value} km`;
        safeSet(STORAGE_KEYS.radius, els.radius.value);
        render();
      });

      els.zeitraum.addEventListener('change', () => {
        els.customRange.classList.toggle('visible', els.zeitraum.value === 'custom');
        safeSet(STORAGE_KEYS.zeitraum, els.zeitraum.value);
        render();
      });

      els.sortierung.addEventListener('change', () => {
        safeSet(STORAGE_KEYS.sortierung, els.sortierung.value);
        render();
      });

      els.von.addEventListener('change', () => { safeSet(STORAGE_KEYS.von, els.von.value); render(); });
      els.bis.addEventListener('change', () => { safeSet(STORAGE_KEYS.bis, els.bis.value); render(); });

      els.zeitVon.addEventListener('change', () => { safeSet(STORAGE_KEYS.zeitVon, els.zeitVon.value); render(); });
      els.zeitBis.addEventListener('change', () => { safeSet(STORAGE_KEYS.zeitBis, els.zeitBis.value); render(); });
      els.altersgruppe.addEventListener('change', () => { safeSet(STORAGE_KEYS.altersgruppe, els.altersgruppe.value); render(); });

      els.vereinAddBtn.addEventListener('click', addExcludedClub);
      els.vereinInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); addExcludedClub(); }
      });

      els.viewListBtn.addEventListener('click', () => setView('liste'));
      els.viewMapBtn.addEventListener('click', () => setView('karte'));

      els.installCloseBtn.addEventListener('click', () => {
        els.installBanner.classList.remove('visible');
        safeSet(STORAGE_KEYS.installDismissed, '1');
      });

      els.resetBtn.addEventListener('click', () => {
        for (const key of Object.values(STORAGE_KEYS)) safeRemove(key);
        home = null;
        excludedLigas = new Set();
        excludedClubs = [];
        els.ort.value = '';
        els.ortStatus.textContent = '';
        loadSavedFilters();
        render();
      });
    }

    async function load() {
      try {
        const res = await fetch('data.json?_=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
        if (!data.hallen) data.hallen = {};
        data.openGames.forEach((g, i) => { g._idx = i; });
        loadSavedFilters();
        bindEvents();
        render();
      } catch (err) {
        els.content.innerHTML = `<div class="error">Fehler beim Laden der Daten: ${escapeHtml(err.message)}</div>`;
        els.meta.textContent = '';
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      renderInstallBanner();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    load();
    renderInstallBanner();
  </script>
</body>
</html>
